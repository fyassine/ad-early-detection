[tool.ruff]
# Active code only — legacy trees and generated/data dirs are excluded.
target-version = "py310"
line-length = 100
extend-exclude = [
    "__CLASSIFIER__",
    "ABI/comp_corr_v1.py",
    "ABI/dci_scripts",
    "DCI",
    "DATA/DELCODE",
    # Frozen per-run code snapshots — historical copies, never linted.
    "BRAINTOKENGT/outputs",
    ".venv",
    "**/wandb",
    "**/_embeddings_cache_",
    "DASHBOARD/app/static/dist",
    "DASHBOARD/frontend/dist",
    "*.ipynb",
]

[tool.ruff.lint]
# Start conservative: pyflakes (F), import sorting (I), a subset of pycodestyle (E/W),
# and the most useful bugbear checks (B). Expand over time.
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # line length — enforced by the formatter, not the linter
    "E741",  # ambiguous variable names (l, I) — common in math code here
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports
"**/tests/**" = ["F811", "F401"]

[tool.mypy]
# Non-blocking in CI (see .github/workflows/test.yml) — codebase is not fully
# annotated yet. ignore_missing_imports covers untyped third-party deps
# (torch_geometric, nilearn, lifelines, scikit-survival, wandb).
python_version = "3.10"
ignore_missing_imports = true
mypy_path = "."
explicit_package_bases = true
exclude = '''(?x)(
    ^__CLASSIFIER__/
  | ^ABI/comp_corr_v1\.py$
  | ^ABI/dci_scripts/
  | ^DCI/
  | ^DATA/DELCODE/
  | /checkpoints/.*/source/
  | ^CLASSIFIER/outputs/
  | ^PROGNOSER/outputs/
  | ^ABI/outputs/
  | ^DASHBOARD/\.venv/
)'''

[tool.pytest.ini_options]
# Coverage is not enforced (no --cov-fail-under) — it's informational only, so it's
# passed explicitly by the one place that wants the report (CI's `test` job in
# .github/workflows/test.yml) rather than baked in here. Keeping it out of addopts
# means local/agent `pytest` runs (including scripts/run_checks.py) stay fast and quiet.

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/__CLASSIFIER__/*",
    "*/ABI/comp_corr_v1.py",
    "*/ABI/dci_scripts/*",
    "*/DCI/*",
]
