# Temporal-First Graph Network (TFGN) ablation ladder — pooled ADNI+DELCODE ->
# external OASIS-3. Pre-registration: DOCS/temporal-first-ablation.md. Full plan:
# DOCS/flipped/PLAN.md Phase 4 + the 2026-08-24 addendum ("Block 2/3").
#
# Every entry shares: dataset: POOLED_WHOLE_BRAIN, threshold_mode: best-f1,
# notebook: notebooks/LONGITUDINAL/LONGITUDINAL_COMMON_DELCODE.ipynb,
# hyperparams.external_test_cohort: oasis3, hyperparams.min_visits: 2 (SENS
# overrides to 3), seeds 42/43/44/45. TFGN arms (S1+) share
# config_path: configs/tfgn_pooled.json, which encodes the S1 ("flip") baseline —
# every later TFGN rung's hyperparams block is only the delta from that baseline,
# same pattern as configs/gelstm_recon_ablation_delcode.json in ablation.yaml.
#
# Written in two passes per the ladder's own gating rule ("S1b's outcome sets
# node_lstm_init for S1c-S5" - DOCS/temporal-first-ablation.md "The arms"):
# this file currently holds Stage 0 (S0a-S0d) + S1 + S1b — the ungated portion
# that can run without waiting on any prior rung's stopping-rule verdict. S1c
# through SENS are appended only after S1b reports, per the pre-registration's
# "never a silent edit" rule — do not pre-write their hyperparams blocks here.
#
# S0b/S0c's checkpoint_path points at the new pooled ADNI+DELCODE GAAE
# (gaae-pretrain-pooled-adni-delcode, P1 of Phase 2) — filled in once that run
# completes; do not point it at the DELCODE-only ethereal-planet-16 checkpoint,
# that would silently break the "same encoder pretraining pool as the
# classifier's own training pool" premise the whole ladder depends on.

experiments:
  # ── S0a: logreg-drift — linear floor on raw FC change ──────────────────────
  - id: tfgn-s0-logreg-drift-pooled-seed42
    mode: longitudinal
    model: LogRegDrift
    dataset: POOLED_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/LONGITUDINAL/LONGITUDINAL_COMMON_DELCODE.ipynb
    adapter: logregdrift
    hyperparams:
      encoder_init: none  # bypasses the notebook's GAAE-checkpoint gate; adapter never reads it
      external_test_cohort: oasis3
      min_visits: 2
    threshold_mode: best-f1
    notes: "S0a 1/4: logistic regression on PCA-compressed ΔA + metadata. Floor: is there signal in raw change at all?"

  - id: tfgn-s0-logreg-drift-pooled-seed43
