# Temporal-First Graph Network (TFGN) ablation ladder — pooled ADNI+DELCODE ->
# external OASIS-3. Pre-registration: DOCS/temporal-first-ablation.md. Full plan:
# DOCS/flipped/PLAN.md Phase 4 + the 2026-08-24 addendum ("Block 2/3").
#
# Every entry shares: dataset: POOLED_WHOLE_BRAIN, threshold_mode: best-f1,
# notebook: notebooks/LONGITUDINAL/LONGITUDINAL_COMMON_DELCODE.ipynb,
# hyperparams.external_test_cohort: oasis3, hyperparams.min_visits: 2 (SENS
# overrides to 3), hyperparams.defer_test_eval: true (2026-08-24 addendum, see
# below), seeds 42/43/44/45. TFGN arms (S1+) share
# config_path: configs/tfgn_pooled.json, which encodes the S1 ("flip") baseline —
# every later TFGN rung's hyperparams block is only the delta from that baseline,
# same pattern as configs/gelstm_recon_ablation_delcode.json in ablation.yaml.
#
# Written in passes per the ladder's own gating rule ("S1b's outcome sets
# node_lstm_init for S1c-S5" - DOCS/temporal-first-ablation.md "The arms"):
# each rung's hyperparams block is added only once the rung(s) before it have
# reported against the stopping rule, per the pre-registration's "never a
# silent edit" rule. S2 through SENS are still pending on S1c.
#
# S1b fork resolved 2026-08-24: S1/S1b both completed 4/4 seeds, OOF-AUC
# stopping rule mean(Δ)=0.01067 SE(Δ)=0.00521 ratio=2.05 -> passes ->
# node_lstm_init: pretrained_finetuned carries into S1c-S5 (S1's own entries
# above are untouched — only S1c onward inherit the winning value). Full
# per-seed table in DOCS/temporal-first-ablation.md "S1b fork decision".
#
# S0b/S0c's checkpoint_path points at the new pooled ADNI+DELCODE GAAE
# (gaae-pretrain-pooled-adni-delcode, P1 of Phase 2) — do not point it at the
# DELCODE-only ethereal-planet-16 checkpoint, that would silently break the
# "same encoder pretraining pool as the classifier's own training pool"
# premise the whole ladder depends on. P1's run_experiment.py status shows
# "failed" (NameError: ADAPTER_KEY, a pre-existing bug in
# STATIC_COMMON_DELCODE.ipynb, now fixed — unrelated to this ladder) but
# training completed the full 500-epoch budget and the checkpoint saved
# successfully *before* that crash: verified by loading it directly
# (GraphAttentionAutoencoderConditioned, 952,136 params) and by
# history.json/run_config.json (618/443/422 graphs, best_val_loss=0.0188 at
# epoch 499/500). Reconstructed metrics patched into
# outputs/gaae-pretrain-pooled-adni-delcode/runs/.../run_summary.json.
#
# Evaluation & Comparison Protocol addendum (2026-08-24,
# DOCS/temporal-first-ablation.md "Evaluation & Comparison Protocol"):
# every entry below now carries hyperparams.defer_test_eval: true, so a run
# writes no test_*/ext_* keys (the frozen in-domain + OASIS-3 reads happen
# exactly once, later, via CLASSIFIER/common/frozen_read.py from
# notebooks/COMPARISON/COMPARISON_TEMPORAL_FIRST_LADDER.ipynb) and instead
# writes run_summary["oof"] (CLASSIFIER/common/oof.py, via a per-fold
# fold_probe wired into the shared notebook). This is not a new protocol for
# S1c (not yet launched, unaffected by the flag beyond deferring its own test
# reads) but it DOES require the 24 already-complete S0a-S0d/S1/S1b runs
# (4 seeds each) to be **re-run** — their existing run_summary.json predates
# the "oof" block. New Tier-1 floor: tfgn-s0-demo-pooled (age+sex only, no
# PCA/ΔA — adapters/logreg_drift.py's feature_set="demo").

experiments:
  # ── S0-demo: demographics floor — is there signal beyond age/sex at all? ──
  - id: tfgn-s0-demo-pooled-seed42
    mode: longitudinal
    model: LogRegDrift
    dataset: POOLED_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/LONGITUDINAL/LONGITUDINAL_COMMON_DELCODE.ipynb
    adapter: logregdrift
    hyperparams:
      encoder_init: none  # bypasses the notebook's GAAE-checkpoint gate; adapter never reads it
      feature_set: demo
      external_test_cohort: oasis3
      min_visits: 2
      defer_test_eval: true
    threshold_mode: best-f1
    notes: "S0-demo 1/4: Tier-1 demographics floor, [age, sex] only, no PCA/ΔA. Every other arm must beat this on OOF AUC."

