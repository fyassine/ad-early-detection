# External Validation on ADNI and OASIS-3 (Phases C and D).
#
# Context: DOCS/timeline/comparison-plan-v2.md §5.
# ADNI (n=192 with >=2 sessions; 51 converters) is the primary external validation
# cohort for the GELSTM vs BrainTokenGT head-to-head (Phase C).
# OASIS-3 (n=60 with >=2 sessions; 31 converters) is the secondary robustness probe (Phase D).

experiments:
  # =========================================================================
  # Phase C: ADNI Validation (seeds 42..45)
  # =========================================================================
  - id: ext-adni-gelstm-none-seed42
    mode: longitudinal
    model: GELSTM
    dataset: ADNI_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/LONGITUDINAL/LONGITUDINAL_COMMON_DELCODE.ipynb
    adapter: gelstm
    config_path: configs/gelstm_recon_ablation_delcode.json
    hyperparams:
      encoder_init: none
      cohort: adni
    checkpoint_path: notebooks/checkpoints/checkpoints_gaae_whole_brain/ethereal-planet-16_2026-06-10_12-31-05/model_ethereal-planet-16_2026-06-10_12-31-05.pth
