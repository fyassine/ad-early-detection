# GELSTM vs BrainTokenGT — matched-cohort head-to-head (B.1.1-B.1.4).
#
# Context: DOCS/meetings/ninth-meeting/comparison-plan-v2.md. BrainTokenGT's
# adapter restricts subjects to `min_visits=2, max_visits=3` (the regime its
# authors evaluated); GELSTM's other registry entries do not, so any prior
# score comparison was on different cohorts. `min_visits`/`max_visits` support
# was added to `LongitudinalSubjectDataset` (CLASSIFIER/model/GELSTM/dataset.py)
# and wired through `GELSTMAdapter` (CLASSIFIER/adapters/gelstm.py) to close
# that gap. Cohort parity (same 120 subject IDs, same n_scans/subject) was
# verified against `BrainTokenGTAdapter.prepare_data` before registering these.
#
# Otherwise identical to the `recon-ablation-gelstm-pretrained-frozen*` arm in
# ablation.yaml / ablation_seeds.yaml (same config_path, same checkpoint_path,
# same encoder_init) — only the cohort window changes. Four seeds (not one) for
# the same reason as ablation_seeds.yaml: a single seed is not a measurement,
# and this row is what gets quoted against the BrainTokenGT seed spread in
# BRAINTOKENGT/experiments/ablation_seeds.yaml.
experiments:
  - id: recon-ablation-gelstm-pretrained-frozen-2to3v-seed42
    mode: longitudinal
    model: GELSTM
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/LONGITUDINAL/LONGITUDINAL_COMMON_DELCODE.ipynb
    adapter: gelstm
    config_path: configs/gelstm_recon_ablation_delcode.json
    hyperparams:
      encoder_init: pretrained_frozen
      min_visits: 2
      max_visits: 3
    checkpoint_path: notebooks/checkpoints/checkpoints_gaae_whole_brain/ethereal-planet-16_2026-06-10_12-31-05/model_ethereal-planet-16_2026-06-10_12-31-05.pth
    threshold_mode: best-f1
    notes: >-
      Matched-cohort GELSTM (pretrained_frozen, min_visits=2/max_visits=3) for
      the BrainTokenGT head-to-head. Seed 1/4.

