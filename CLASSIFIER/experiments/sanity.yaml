# Sanity floors and visit-count confound diagnostics
experiments:
  - id: sanity-split-hygiene
    mode: sanity
    model: n/a
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/SANITY/SANITY_SPLIT_HYGIENE_DELCODE.ipynb
    notes: Hard-fails if any subject crosses train/val/test.

  - id: sanity-metadata-baseline
    mode: sanity
    model: LogReg
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/SANITY/SANITY_BASELINE_METADATA_TIME.ipynb
    notes: Metadata-only floor (age, sex, visit time).

  - id: sanity-gelstm-ablations
    mode: sanity
    model: GELSTM
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/SANITY/SANITY_LONGITUDINAL_GELSTM.ipynb
    # Pinned rather than left to the notebook's headless "latest checkpoint"
    # fallback: that fallback resolves by sort order, so adding any newer GELSTM
    # checkpoint would silently change what this ablation was measured against.
    checkpoint_path: notebooks/checkpoints/checkpoints_gelstm_whole_brain/gelstm_wholebrain_2026-06-12_15-44-49/model_gelstm_wholebrain_2026-06-12_15-44-49.pth
    threshold_mode: youden
    notes: >-
      Shuffled-order, no-Δt, fixed-N ablations. Eval-only against an already
      trained GELSTM checkpoint — no retraining, so this is minutes not hours.
      Supplies the only controlled evidence that the recurrence uses temporal
      order and Δt at all (baseline vs. checks 2 and 3), plus the metadata-only
      floor every results table is anchored against.

  # Visit-count confound diagnostics — reload each model's latest trajectory run
  # (no retraining) and quantify the converters-have-fewer-visits confound.
  - id: sanity-visit-confound-gec
    mode: sanity
    model: GEC
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/SANITY/SANITY_VISIT_COUNT_CONFOUND.ipynb
    adapter: gec
    source_experiment: gec-trajectory-whole-brain
    notes: Visit-count confound diagnostics on the latest GEC trajectory model.

  - id: sanity-visit-confound-gelstm
    mode: sanity
    model: GELSTM
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/SANITY/SANITY_VISIT_COUNT_CONFOUND.ipynb
    adapter: gelstm
    source_experiment: gelstm-trajectory-whole-brain
    notes: Visit-count confound diagnostics on the latest GELSTM trajectory model.

  - id: sanity-visit-confound-gegru
    mode: sanity
    model: GELSTM
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/SANITY/SANITY_VISIT_COUNT_CONFOUND.ipynb
    adapter: gelstm
    source_experiment: gegru-trajectory-whole-brain
    notes: Visit-count confound diagnostics on the latest GEGRU (GRU) trajectory model.

  - id: sanity-visit-confound-gelstm-wide-lnorm
    mode: sanity
    model: GELSTM
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/SANITY/SANITY_VISIT_COUNT_CONFOUND.ipynb
    adapter: gelstm
    source_experiment: gelstm-whole-brain-wide-lnorm
    notes: Confound + spread diagnostics on the wider-LayerNorm GELSTM variant.

  - id: sanity-gegru-synthetic-scanner-drift
    mode: sanity
    model: GELSTM
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/SANITY/SANITY_GEGRU_SYNTHETIC_SCANNER_DRIFT.ipynb
    adapter: gelstm
    source_experiment: gegru-trajectory-whole-brain
    site_stats_experiment_id: comparison-gegru-cross-dataset
    notes: >-
      Simulated ADNI/OASIS3-like scanner-drift degradation sweep on the latest
      GEGRU trajectory model, calibrated against comparison-gegru-cross-dataset's
      site_heterogeneity_stats.json (run that experiment first).

  # Model comparison overview
  - id: model-comparison
    mode: baseline
    model: multi
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/BASELINE/BASELINE_MODEL_COMPARISON_DELCODE_WHOLE_BRAIN.ipynb
    notes: Subject-level comparison table across trajectory, early-detection, and static models.
