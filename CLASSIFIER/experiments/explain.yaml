# Explainability / diagnostics — one adapter-driven notebook, no retraining.
# Needs CLASSIFIER/requirements-explain.txt (captum, nilearn).
experiments:
  - id: explain-gaae
    mode: explain
    model: GAAE
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/EXPLAIN/EXPLAIN_COMMON_DELCODE.ipynb
    adapter: gaae
    config_path: configs/gaae_delcode_whole_brain.json
    checkpoint_path: notebooks/checkpoints/checkpoints_gaae_whole_brain/GAAE.pth
    notes: GAAE encoder explainability — latent space, GAT attention, reconstruction, latent-dim IG / GNNExplainer.

  - id: explain-gec
    mode: explain
    model: GEC
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/EXPLAIN/EXPLAIN_COMMON_DELCODE.ipynb
    adapter: gec
    source_experiment: gec-trajectory-whole-brain
    notes: Diagnose + explain the latest GEC trajectory run (reload, no retraining).

  - id: explain-gelstm
    mode: explain
    model: GELSTM
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/EXPLAIN/EXPLAIN_COMMON_DELCODE.ipynb
    adapter: gelstm
    source_experiment: gelstm-trajectory-whole-brain
    notes: Diagnose + explain the latest GELSTM trajectory run (hidden states, occlusion, ablations).

  # gelstm-trajectory-whole-brain's `latest` still points at the pre-fix June-era
  # checkpoint (encoder swap + downstream hyperparameter shrink bundled into one
  # commit, see DOCS/meetings/seventh-meeting/gaae-downstream-leakage-investigation.md).
  # This entry reloads the clean, seeded August recon-ablation frozen-encoder run
  # already reported in Ch.6 RQ2 instead, so the latent-space instrumentation
  # (disease axis, latent steering, Fisher discriminant, logreg probe) has the same
  # provenance standard as the rest of the thesis.
  - id: explain-gelstm-frozen-clean
    mode: explain
    model: GELSTM
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/EXPLAIN/EXPLAIN_COMMON_DELCODE.ipynb
    adapter: gelstm
    source_experiment: recon-ablation-gelstm-pretrained-frozen
    notes: >-
      Diagnose + explain the clean, seed-42, commit-20b595788 frozen-encoder GELSTM
      run (thesis Ch.6 RQ2), not the June-era gelstm-trajectory-whole-brain checkpoint.

  - id: explain-gegru
    mode: explain
    model: GELSTM
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/EXPLAIN/EXPLAIN_COMMON_DELCODE.ipynb
    adapter: gegru
    source_experiment: gegru-trajectory-whole-brain
    notes: Diagnose + explain the latest GEGRU (GRU) trajectory run.

  - id: explain-gep
    mode: explain
    model: GEP
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/EXPLAIN/EXPLAIN_COMMON_DELCODE.ipynb
    adapter: gep
    source_experiment: gep-trajectory-whole-brain
    notes: Diagnose + explain the latest pooled-embedding MLP run (reload, no retraining).

  # VGAE encoder explainability (latent space, diagonal-masked adjacency reconstruction
  # scored as edge AUC/AP, GAT attention). Reconstruction is FiLM-conditioned, so each
  # entry's checkpoint_path must be a re-pretrained encoder (run vgae-*-static-anticollapse
  # first); the pre-conditioning VGAE_*.pth no longer loads. config_path must match the
  # arch (and feature_decoder) the checkpoint was trained with.
  - id: explain-vgae-gcn-anticollapse
    mode: explain
    model: VGAE
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/EXPLAIN/EXPLAIN_COMMON_DELCODE.ipynb
    adapter: vgae
    config_path: configs/vgae_gcn_anticollapse_delcode_whole_brain.json
    checkpoint_path: notebooks/checkpoints/checkpoints_vgae_whole_brain/VGAE_GCN_ANTICOLLAPSE.pth
    notes: Anti-collapse VGAE (GCN) encoder explainability.

  - id: explain-vgae-gat-anticollapse
    mode: explain
    model: VGAE
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/EXPLAIN/EXPLAIN_COMMON_DELCODE.ipynb
    adapter: vgae
    config_path: configs/vgae_gat_anticollapse_delcode_whole_brain.json
    checkpoint_path: notebooks/checkpoints/checkpoints_vgae_whole_brain/VGAE_GAT_ANTICOLLAPSE.pth
    notes: Anti-collapse VGAE (GAT) encoder explainability.
