# Static models (GAAE, VGAE, baselines)
experiments:
  - id: gaae-static
    mode: static
    model: GAAE
    adapter: gaae
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/STATIC/STATIC_COMMON_DELCODE.ipynb
    config_path: configs/gaae_delcode_whole_brain.json
    threshold_mode: best-f1
    notes: Per-scan GAAE-embedding with subject rollup.

  # DOCS/flipped/PLAN.md Phase 2 (P1) — GAAE pretrained on the pooled ADNI+DELCODE
  # unlabelled pretrain split (~3700 graphs; DATA/manifest/build_pooled_assets.py's
  # symlink farm + pooled pretrain CSVs). OASIS-3 excluded so it stays fully external.
  # Same architecture/config as gaae-static (ethereal-planet-16) so every downstream
  # arm (S0b/S1c GELSTM encoder_init, TFGN GVAE encoder_init) is directly comparable.
  - id: gaae-pretrain-pooled-adni-delcode
    mode: static
    model: GAAE
    adapter: gaae
    dataset: POOLED_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/STATIC/STATIC_COMMON_DELCODE.ipynb
    config_path: configs/gaae_delcode_whole_brain.json
    threshold_mode: best-f1
    notes: Pooled ADNI+DELCODE GAAE pretrain (Phase 2 P1) — checkpoint feeds S0b/S1c.

  # VGAE encoders — pre-trained on adjacency reconstruction (masked BCE + β·KL) with
  # always-on FiLM age/sex conditioning of the latent (mirrors the GAAE), plus an
  # anti-collapse remedy: β-warmup, per-dim free-bits KL floor, and a node-feature
  # decoder. RE-PRETRAIN REQUIRED: the FiLM params did not exist in the earlier
  # VGAE_GCN.pth / VGAE_GAT.pth, so those checkpoints no longer load (the explain
  # adapter raises a clear "re-pretrain" error). The trained encoder is consumed
  # downstream by setting encoder_arch=vgae + checkpoint_path on a gep/gec/gelstm entry.
  - id: vgae-gcn-static-anticollapse
    mode: static
    model: VGAE
    adapter: vgae
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/STATIC/STATIC_COMMON_DELCODE.ipynb
    config_path: configs/vgae_gcn_anticollapse_delcode_whole_brain.json
    notes: Anti-collapse VGAE(GCN) — β-warmup 100 + free_bits 0.5 + feature decoder.

  - id: vgae-gat-static-anticollapse
    mode: static
    model: VGAE
    adapter: vgae
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/STATIC/STATIC_COMMON_DELCODE.ipynb
    config_path: configs/vgae_gat_anticollapse_delcode_whole_brain.json
    notes: Anti-collapse VGAE(GAT) — β-warmup 100 + free_bits 0.5 + feature decoder.

  - id: gaae-latent-experiment
    mode: static
    model: GAAE
    adapter: gaae
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/STATIC/GAAE_LATENT_SPACE_VISUALIZER.ipynb
    config_path: configs/gaae_delcode_whole_brain.json
    notes: >
      GAAE latent-space analysis — UMAP projection, logistic-regression probe,
      Fisher discriminant ratio, attention heatmap, disease-axis steering,
      and interactive 3-D Plotly visualisations.

  - id: logreg-static
    mode: static
    model: LogReg
    dataset: DELCODE_WHOLE_BRAIN
    seed: 42
    notebook: notebooks/STATIC/STATIC_LOGREG_DELCODE_WHOLE_BRAIN.ipynb
    config_path: configs/gaae_logreg_delcode.json
    threshold_mode: best-f1
    notes: Per-scan logistic regression baseline.
